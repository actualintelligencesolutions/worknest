name: Build and Deploy

on:
  push:
    branches:
      - 'uat'
      - 'publish'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'  # Matches local env (v23.10.0)
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ui

      - name: Run Build
        run: npm run build
        working-directory: ui

      - name: Commit and Push Changes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}  # Use the PAT for authentication when pushing
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "PAT_TOKEN secret is not configured."
            exit 1
          fi

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ui/dist -f
          git add -u ui/dist
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Trigger deployment [skip ci]"
          else
            git commit -m "Deploy build [skip ci]"
          fi
          echo "Pushing deploy commit $(git rev-parse --short HEAD) to ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"  # Use the PAT token for pushing changes