name: Build and Deploy

on:
  push:
    branches:
      - stage
      - publish
  workflow_dispatch:

permissions:
  contents: write

env:
  UI_DIR: ui
  NODE_VERSION: 22

jobs:
  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.UI_DIR }}
        run: npm ci

      - name: Check formatting
        working-directory: ${{ env.UI_DIR }}
        run: npm run format

      - name: Run lint
        working-directory: ${{ env.UI_DIR }}
        run: npm run lint

      - name: Run tests
        working-directory: ${{ env.UI_DIR }}
        run: npm run test

      - name: Build
        working-directory: ${{ env.UI_DIR }}
        run: npm run build

      - name: Commit UI build output
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${UI_DIR}/dist"
          git add -u "${UI_DIR}/dist"
          if git diff --cached --quiet; then
            echo "No UI build changes to commit."
          else
            git commit -m "Build UI dist [skip ci]"
            git push
          fi

      - name: Trigger deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "DEPLOY_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          headers=(
            -H "Content-Type: application/json"
            -H "X-GitHub-Event: workflow_deploy"
          )

          if [ -n "${DEPLOY_WEBHOOK_TOKEN}" ]; then
            headers+=(-H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}")
          fi

          curl --fail --show-error --silent \
            "${headers[@]}" \
            --data "{\"repository\":\"${GITHUB_REPOSITORY}\",\"branch\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\",\"run_id\":\"${GITHUB_RUN_ID}\"}" \
            "${DEPLOY_WEBHOOK_URL}"

          echo "Deployment webhook triggered."

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist-${{ github.ref_name }}
          path: ${{ env.UI_DIR }}/dist
          if-no-files-found: error
          retention-days: 14
