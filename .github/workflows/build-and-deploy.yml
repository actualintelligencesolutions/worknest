name: Build and Deploy

on:
  push:
    branches:
      - uat
      - publish
  workflow_dispatch:

permissions:
  contents: write

env:
  UI_DIR: ui
  NODE_VERSION: 23

jobs:
  build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.UI_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.UI_DIR }}
        run: npm run build

      - name: Commit and Push Changes
        if: github.event_name == 'push'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -f "${UI_DIR}/dist"
          git commit -m "Deploy build [skip ci]" || echo "No changes to commit"
          git push "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist-${{ github.ref_name }}
          path: ${{ env.UI_DIR }}/dist
          if-no-files-found: error
          retention-days: 14
